name: Build and Release Desktop (Windows/Linux/macOS)

on:
  push:
    branches: ["master"]
    tags:
      - "v*.*.*"
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    name: Publish ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Publish ${{ matrix.rid }} (Release, self-contained, single-file)
        run: >-
          dotnet publish LabelPlus_Next.Desktop/LabelPlus_Next.Desktop.csproj
          -c Release
          -r ${{ matrix.rid }}
          -p:PublishSingleFile=true
          -p:SelfContained=true
          -p:PublishTrimmed=false
          -p:EnableCompressionInSingleFile=true

      - name: Upload artifact ${{ matrix.rid }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.rid }}
          path: LabelPlus_Next.Desktop/bin/Release/net10.0/${{ matrix.rid }}/publish/

      - name: Publish updater ${{ matrix.rid }} (Release, self-contained, single-file)
        run: >-
          dotnet publish LabelPlus_Next.Update/LabelPlus_Next.Update.csproj
          -c Release
          -r ${{ matrix.rid }}
          -p:PublishSingleFile=true
          -p:SelfContained=true
          -p:PublishTrimmed=false
          -p:EnableCompressionInSingleFile=true

      - name: Upload updater artifact ${{ matrix.rid }}
        uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.rid }}
          path: LabelPlus_Next.Update/bin/Release/net10.0/${{ matrix.rid }}/publish/

  # Build the platform installers for tags from the already-published payloads.
  # They are produced on Linux with the same scripts used locally (NSIS, dpkg,
  # rpmbuild, AppImage tooling, HFS+ -> UDIF for macOS), so artifacts match the
  # repository's packaging scripts. Nightly builds stay zip-only to avoid
  # uploading ~1.4 GB of installers on every master push.
  installers:
    name: Build installers
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download publish artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Assemble publish tree
        shell: bash
        run: |
          set -euo pipefail
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            mkdir -p "artifacts/publish/$rid/desktop" "artifacts/publish/$rid/updater"
            cp -a "artifacts/desktop-$rid/." "artifacts/publish/$rid/desktop/"
            cp -a "artifacts/updater-$rid/." "artifacts/publish/$rid/updater/"
          done

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nsis rpm squashfs-tools imagemagick hfsprogs zip cmake \
            build-essential pkg-config libssl-dev zlib1g-dev python3

      - name: Ensure HFS+ tool is on PATH
        shell: bash
        run: |
          if ! command -v mkfs.hfsplus >/dev/null 2>&1; then
            sudo ln -sf /usr/sbin/mkfs.hfsplus /usr/local/bin/mkfs.hfsplus
          fi

      - name: Build installers
        shell: bash
        run: |
          set -euo pipefail
          chmod +x packaging/*.sh packaging/lib/*.sh packaging/*/*.sh
          packaging/windows/build-windows.sh
          packaging/linux/build-linux.sh
          packaging/macos/build-macos.sh

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release/installers
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\n' \
            | sort | xargs -r sha256sum > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          ls -lh

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: release/installers/
          retention-days: 7
          if-no-files-found: error

  release:
    name: Create GitHub Release and attach assets
    runs-on: ubuntu-latest
    needs: [build, installers]
    # `always()` keeps nightly releases working when the installers job is skipped.
    if: ${{ always() && needs.build.result == 'success' }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Zip artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd artifacts
          for d in */; do
            folder="${d%/}"                   # e.g., desktop-win-x64 / updater-win-x64
            case "$folder" in
              desktop-*)
                project="LabelPlus_Next.Desktop"
                rid="${folder#desktop-}"
                ;;
              updater-*)
                project="LabelPlus_Next.Update"
                rid="${folder#updater-}"
                ;;
              *)
                continue
                ;;
            esac
            out="${project}-${rid}.zip"
            (cd "$folder" && zip -r "../$out" .)
          done
          ls -al

      - name: Generate changelog
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          mkdir -p artifacts
          CHANGELOG="artifacts/CHANGELOG.md"
          REF_TYPE="${GITHUB_REF_TYPE:-${{ github.ref_type }}}"
          REF="${GITHUB_REF:-${{ github.ref }}}"
          if [[ "$REF" == refs/tags/* ]]; then
            current_tag="${REF#refs/tags/}"
            notes=".github/release-notes/${current_tag}.md"
            if [[ -f "$notes" ]]; then
              cp "$notes" "$CHANGELOG"
            else
              prev_tag=$(git describe --tags --abbrev=0 "${current_tag}^" 2>/dev/null || true)
              {
                echo "# Changelog for ${current_tag}";
                echo;
                if [[ -n "$prev_tag" ]]; then
                  echo "Changes since ${prev_tag}:";
                  echo;
                  git log --no-merges --pretty=format:'- %s (%h) by %an' "${prev_tag}..${current_tag}";
                else
                  echo "Initial release ${current_tag}.";
                  echo;
                  git log --no-merges --pretty=format:'- %s (%h) by %an' "${current_tag}";
                fi;
                echo;
              } > "$CHANGELOG"
            fi
          else
            {
              echo "# Nightly build changelog";
              echo;
              echo "Recent changes:";
              echo;
              git log -n 100 --no-merges --pretty=format:'- %s (%h) by %an' ;
              echo;
            } > "$CHANGELOG"
          fi

      - name: Create or update prerelease (nightly)
        if: ${{ github.ref_type != 'tag' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ github.run_number }}
          name: Nightly build #${{ github.run_number }}
          prerelease: true
          body_path: artifacts/CHANGELOG.md
          files: |
            artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release for tag
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          # For tag pushes, action will use the tag in github.ref by default
          name: Release ${{ github.ref_name }}
          prerelease: false
          body_path: artifacts/CHANGELOG.md
          files: |
            artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers to tag release
        if: ${{ startsWith(github.ref, 'refs/tags/') && needs.installers.result == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          gh release upload "$tag" artifacts/installers/* --clobber

      - name: Warn when installers were not built
        if: ${{ startsWith(github.ref, 'refs/tags/') && needs.installers.result != 'success' }}
        shell: bash
        run: echo "::warning::Installer build did not succeed; the release contains zip assets only."
